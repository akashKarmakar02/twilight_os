<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>404 Not Found</title>
    <link rel="stylesheet" href="/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar__inner">
        <a class="brand" href="/">
          <span class="brand__dot" aria-hidden="true"></span>
          <span class="brand__name">TwilightFS</span>
        </a>
        <div class="topbar__actions">
          <a class="btn btn--ghost" href="/">Home</a>
        </div>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <div class="card">
          <p class="eyebrow">Error</p>
          <h1 class="hero__title" style="margin-bottom: 8px">404</h1>
          <p class="section__lead" style="margin: 0 0 14px">
            The requested file does not exist in <code>/var/www</code>.
          </p>
          <div class="hero__cta">
            <a class="btn" href="/">Back to homepage</a>
            <a class="btn btn--ghost" href="/missing.html">Try again</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
